name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck y metadatos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ShellCheck v0.11.0
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C /tmp
          sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      - name: ShellCheck (todos los .sh)
        run: |
          shellcheck --version
          shellcheck -x -P SCRIPTDIR -s bash harden.sh lib/*.sh modules/*.sh tests/*.sh

      - name: --list-controls (JSON válido) y cobertura de metadatos
        run: |
          bash harden.sh --list-controls --format json > controles.json
          python3 -c "import json; d=json.load(open('controles.json')); print(len(d['controls']), 'controles')"
          bash harden.sh --list-controls --level medio --format text | tail -n 3
          bash tests/check-meta.sh

      - name: Pre-check de cargas críticas (sin root)
        env:
          NO_COLOR: "1"
        run: bash harden.sh --precheck

  # Cada nivel/modo en un job paralelo: el runner tiene un sistema de archivos enorme y
  # los controles que recorren / (SUID, world-writable, sin dueño) tardan varios minutos.
  dry-run:
    name: ${{ matrix.level }} ${{ matrix.mode }} (sin root)
    needs: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        level: [basico, medio, maximo, panico]
        mode: ["--dry-run", "--audit"]
    steps:
      - uses: actions/checkout@v4

      - name: harden.sh --level ${{ matrix.level }} ${{ matrix.mode }}
        env:
          NO_COLOR: "1"
        run: |
          bash harden.sh --level "${{ matrix.level }}" "${{ matrix.mode }}" --yes > out.log 2>&1 \
            || { cat out.log; echo "::error::${{ matrix.level }} ${{ matrix.mode }} falló"; exit 1; }
          sed -n '/^=== EFECTO/,$p' out.log
