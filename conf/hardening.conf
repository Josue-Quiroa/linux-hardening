# shellcheck shell=bash
# shellcheck disable=SC2034
# =============================================================================
# conf/hardening.conf — Configuración de harden.sh (se carga ANTES de los flags;
# los flags de línea de comandos tienen prioridad). Todo es opcional.
# =============================================================================

# --- Identidad del administrador (salvaguardas anti-bloqueo) ------------------
# Usuarios que nunca se bloquean y que se usarán en AllowUsers (pánico).
# Se añaden automáticamente: quien ejecuta sudo y los miembros de sudo/wheel/admin.
ADMIN_USERS=""
# IP/CIDR desde las que administras (imprescindible en pánico si entras por VPN/NAT).
# Ej: "203.0.113.10/32 2001:db8::/64"
ADMIN_IPS=""

# --- SSH ------------------------------------------------------------------------
SSH_PORTS=""             # vacío = autodetectar con `sshd -T` (recomendado)
SSH_ALLOW_GROUPS=""      # máximo: si se define, AllowGroups (ej: "sudo sshusers")

# --- Firewall -------------------------------------------------------------------
FW_ALLOW_IN=""           # puertos entrantes extra: "80/tcp 443/tcp 51820/udp"
FW_ALLOW_OUT=""          # salidas extra en máximo: "25/tcp 5432/tcp"
FW_AUTO_ALLOW_LISTENING=1   # medio: permitir los puertos que ya están escuchando
FW_CONFIRM_TIMEOUT=120   # segundos para confirmar el firewall antes de revertir (0 = sin red de seguridad)
IS_ROUTER=auto           # auto|0|1 — si 1, no se desactiva ip_forward (Docker/K8s/VPN)

# --- Servicios -------------------------------------------------------------------
SERVICES_KEEP=""         # nunca deshabilitar: "cups bluetooth rpcbind"

# --- Logs --------------------------------------------------------------------------
LOG_REMOTE_HOST=""       # servidor syslog central "logs.ejemplo.com:514"

# --- Integridad / dispositivos -------------------------------------------------------
AIDE_INIT=1              # generar la base de AIDE en segundo plano (máximo)
ALLOW_USB_STORAGE=0      # 1 = no bloquear usb-storage en máximo/pánico

# --- Modo PÁNICO ------------------------------------------------------------------------
PANIC_KEEP_SERVICES=""   # servicios que NO se paran: "nginx postgresql"
PANIC_ALLOW_OUT=""       # salidas permitidas: "53/udp 443/tcp" (por defecto: ninguna)
PANIC_KILL_SESSIONS=0    # 1 = cerrar sesiones de los usuarios bloqueados
PANIC_DISABLE_MODULE_LOADING=0  # 1 = kernel.modules_disabled=1 (irreversible hasta reiniciar)
PANIC_UPDATE=0           # 1 = aplicar actualizaciones también en pánico
PANIC_ALLOW_NO_SSH=0     # 1 = permitir lockdown sin ninguna IP admin (sólo consola)

# --- v1.1: pre-check, --safe, reporte ------------------------------------------
SAFE_MODE=0              # 1 = equivalente a --safe siempre (omitir/suavizar controles que chocan con cargas detectadas)
FW_AUTO_ALLOW_MAXLEVEL=2 # hasta qué nivel se permiten automáticamente los puertos en escucha (--safe lo sube a 3)
KEEP_SHELL_USERS=""      # cuentas de sistema que conservan su shell en USR-10 (ej: "postgres git")
DIFF_CONSOLE_LINES=40    # líneas de diff por archivo en consola (changes.diff siempre completo)
